<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="presentation" aria-hidden="true">
  <defs>
    <radialGradient id="ncSweep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1d748e" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#1d748e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1d748e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ncArm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d748e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1d748e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="240" cy="240" r="228" fill="url(#ncSweep)"/>

  <!-- Concentric monitoring rings -->
  <g fill="none" stroke="#134652" stroke-opacity="0.28">
    <circle cx="240" cy="240" r="56"/>
    <circle cx="240" cy="240" r="104"/>
    <circle cx="240" cy="240" r="152"/>
    <circle cx="240" cy="240" r="200" stroke-dasharray="4 9"/>
  </g>

  <!-- Cross hairs -->
  <g stroke="#134652" stroke-opacity="0.18" stroke-width="1">
    <path d="M240 24v432M24 240h432"/>
  </g>

  <!-- Sweep arm -->
  <path d="M240 240 L440 240" stroke="url(#ncArm)" stroke-width="3" stroke-linecap="round"/>

  <!-- Detected changes at different radii: federal, state, local -->
  <g fill="#1d748e">
    <circle cx="240" cy="240" r="7"/>
    <circle cx="314" cy="178" r="5.5" fill-opacity="0.9"/>
    <circle cx="150" cy="292" r="5" fill-opacity="0.7"/>
    <circle cx="356" cy="332" r="4.5" fill-opacity="0.55"/>
    <circle cx="132" cy="146" r="4" fill-opacity="0.4"/>
  </g>
  <g fill="none" stroke="#1d748e" stroke-opacity="0.35">
    <circle cx="314" cy="178" r="13"/>
    <circle cx="150" cy="292" r="12"/>
  </g>
</svg>
