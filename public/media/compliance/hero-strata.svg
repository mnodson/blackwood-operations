<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" width="1440" height="720" role="presentation" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ncPlane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d748e" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#134652" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a2e38" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="ncPlaneFaint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4e8d9c" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#0a2e38" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="ncGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6cb8c7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6cb8c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="720" fill="#0a2e38"/>
  <ellipse cx="980" cy="300" rx="560" ry="420" fill="url(#ncGlow)"/>

  <!-- Layered document planes, each drifting further out of alignment than the last -->
  <g transform="translate(720 360)">
    <g transform="rotate(-14) skewX(-10)">
      <rect x="-300" y="-350" width="600" height="760" rx="6" fill="url(#ncPlaneFaint)" stroke="#4e8d9c" stroke-opacity="0.18"/>
    </g>
    <g transform="rotate(-8) skewX(-10) translate(34 -18)">
      <rect x="-300" y="-350" width="600" height="760" rx="6" fill="url(#ncPlaneFaint)" stroke="#4e8d9c" stroke-opacity="0.22"/>
    </g>
    <g transform="rotate(-3) skewX(-10) translate(72 -34)">
      <rect x="-300" y="-350" width="600" height="760" rx="6" fill="url(#ncPlane)" stroke="#6cb8c7" stroke-opacity="0.30"/>
      <!-- Text ruling: the notice itself -->
      <g fill="#cfeaf1" fill-opacity="0.22">
        <rect x="-232" y="-268" width="300" height="16" rx="3" fill-opacity="0.40"/>
        <rect x="-232" y="-224" width="430" height="9" rx="3"/>
        <rect x="-232" y="-198" width="410" height="9" rx="3"/>
        <rect x="-232" y="-172" width="446" height="9" rx="3"/>
        <rect x="-232" y="-146" width="286" height="9" rx="3"/>
        <rect x="-232" y="-88" width="220" height="13" rx="3" fill-opacity="0.36"/>
        <rect x="-232" y="-50" width="438" height="9" rx="3"/>
        <rect x="-232" y="-24" width="404" height="9" rx="3"/>
        <rect x="-232" y="2" width="440" height="9" rx="3"/>
        <rect x="-232" y="28" width="332" height="9" rx="3"/>
        <rect x="-232" y="86" width="252" height="13" rx="3" fill-opacity="0.36"/>
        <rect x="-232" y="124" width="424" height="9" rx="3"/>
        <rect x="-232" y="150" width="446" height="9" rx="3"/>
        <rect x="-232" y="176" width="368" height="9" rx="3"/>
      </g>
    </g>
  </g>

  <!-- Drifting alignment marks -->
  <g stroke="#6cb8c7" stroke-opacity="0.28" stroke-width="1.5" fill="none">
    <path d="M140 196h96M140 196v96"/>
    <path d="M1300 524h-96M1300 524v-96"/>
  </g>
</svg>
